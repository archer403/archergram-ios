name: ArcherGram iOS

# Builds an unsigned ArcherGram.ipa (fake codesigning, like Telegram's own CI).
# Install it on an iPhone with Sideloadly / AltStore, which re-signs it with your Apple ID.

on:
  workflow_dispatch:
  push:
    branches: [ archergram ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build ArcherGram
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          # the fake codesigning profiles of the Telegram repo are expired; Sideloadly re-signs the IPA anyway,
          # so the expiration check of rules_apple is turned off for this unsigned build
          python3 - <<'PY'
          p = 'build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py'
          s = open(p).read()
          s = s.replace("if expire and expire < datetime.datetime.now():", "if False and expire and expire < datetime.datetime.now():")
          open(p, 'w').write(s)
          print('profile expiration check disabled')
          PY
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_archergram"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/archergram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${GITHUB_RUN_NUMBER}"
          mkdir -p /Users/Shared/out
          IPA=$(ls bazel-bin/Telegram/Telegram.ipa bazel-out/*/bin/Telegram/Telegram.ipa 2>/dev/null | head -1)
          echo "IPA: $IPA"
          cp -L "$IPA" /Users/Shared/out/ArcherGram.ipa
          ls -la /Users/Shared/out

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ArcherGram-ipa
          path: /Users/Shared/out/ArcherGram.ipa
          retention-days: 30
